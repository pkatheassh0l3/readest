"$schema" = "schemas/schema.json"

[default]
description = "Permite navegar por una carpeta compartida del NAS por SMB, traerse libros de ella, subir archivos, sincronizar el progreso de lectura y abrir Tailscale."
permissions = [
    "allow-connect",
    "allow-list",
    "allow-download",
    "allow-upload",
    "allow-mkdir",
    "allow-remove",
    "allow-disconnect",
    "allow-tailscale-status",
    "allow-open-tailscale",
    "allow-uri-display-name",
    "allow-sync-read",
    "allow-sync-write",
    "allow-sync-stat",
    "allow-sync-list",
    "allow-sync-mkdir",
    "allow-sync-remove-dir",
]
